  image: spie_shot_2024.png
  description: The paper evaluates state-of-the-art few-shot object detection methods for detecting anatomical structures in medical imaging, specifically head and neck anatomy in CT scans. It highlights the challenges posed by variable appearances and limited annotated datasets in medical imaging, motivating the use of few-shot approaches like QA-FewDet, Meta Faster R-CNN, and FCT. Experimental results demonstrate that these methods can accurately detect anatomical structures using novel datasets with few images (1- to 30-shot), showing promising potential for clinical integration.
