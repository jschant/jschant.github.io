- title: "Unsupervised Anomaly Detection Framework for Coronary Artery Lesions in CTCA"
  image: isbi_2025_2.png
  description: This study proposes an unsupervised framework for coronary lesion detection in computed tomography coronary angiography (CTCA) that uses vessel linearization to generate small linear volume patches and trains a deep autoencoder model exclusively on normal patches to detect anomalies without requiring lesion location labels. Results demonstrate high accuracy on a public dataset with 97.5% accuracy using per-patient average reconstruction error and 85% using the number of patches with high reconstruction error, offering a scalable solution for coronary artery disease detection without relying on large labeled datasets.
  authors: D. Kang, J. Choi, J. Woo, C.-C. J. Kuo
  link:
